<script>
const KEY='reyproid_orders_v4',P={'UMKM 1':80000,'UMKM 2':100000,BASIC:150000,STANDAR:200000,PROFESIONAL:300000,PREMIUM:400000,'BRANDING ELITE':500000};let data=Array.from({length:50},(_,i)=>({slot:i+1})),active=1,mode='grid';
const $=id=>document.getElementById(id),filled=o=>!!o.nama?.trim(),rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const PROFILE_KEY='reyproid_profile_photo_v1';

function loadProfile(){
 try{
  const saved=localStorage.getItem(PROFILE_KEY);
  if(saved) $('profilePhoto').src=saved;
 }catch(e){}
}

function resizeProfile(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{
    const max=512;
    const scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*scale));
    c.height=Math.max(1,Math.round(img.height*scale));
    const ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',.88));
   };
   img.onerror=reject;
   img.src=reader.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function changeProfile(file){
 if(!file) return;
 if(!file.type.startsWith('image/')) return alert('Pilih file gambar seperti JPG, PNG, WEBP, atau foto dari galeri.');
 try{
  const dataUrl=await resizeProfile(file);
  localStorage.setItem(PROFILE_KEY,dataUrl);
  $('profilePhoto').src=dataUrl;
  toast('Foto profil berhasil diubah');
 }catch(e){
  alert('Foto profil gagal diproses. Coba gunakan gambar lain.');
 }
}

document.getElementById('profilePicker').addEventListener('change',e=>changeProfile(e.target.files[0])); loadProfile(); function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x))data=Array.from({length:50},(_,i)=>x[i]||{slot:i+1})}catch{}render()}function save(msg='Data berhasil disimpan'){localStorage.setItem(KEY,JSON.stringify(data));$('save').innerHTML='<i class="fa-solid fa-check"></i> Tersimpan';toast(msg)}function toast(s){$('toastText').textContent=s;$('toast').classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('on'),1800)}
function stat(o){if(!filled(o))return '<span class="badge b4">KOSONG</span>';if(o.done)return '<span class="badge b1">✓ SELESAI</span>';if(o.proses)return '<span class="badge b2">◉ PROSES</span>';return '<span class="badge b4">MENUNGGU</span>'}function pay(o){return o.pay==='Lunas'?'<span class="badge b1">LUNAS</span>':o.pay==='DP 50%'?'<span class="badge b2">DP 50%</span>':'<span class="badge b3">BELUM</span>'}
function match(o){let q=$('q').value.toLowerCase().trim(),f=$('filter').value,t=[o.nama,o.bidang,o.brief,o.paket,o.jenis].join(' ').toLowerCase();if(q&&!t.includes(q))return false;if(f==='empty'&&filled(o))return false;if(f==='process'&&!(filled(o)&&o.proses))return false;if(f==='done'&&!(filled(o)&&o.done))return false;if(f==='paid'&&o.pay!=='Lunas')return false;if(f==='unpaid'&&(!filled(o)||o.pay==='Lunas'))return false;return true}
function render(){let list=data.filter(match),g=$('grid');$('st1').textContent=data.filter(filled).length;$('st2').textContent=data.filter(o=>filled(o)&&o.proses).length;$('st3').textContent=data.filter(o=>filled(o)&&o.done).length;$('st4').textContent=data.filter(o=>filled(o)&&o.pay==='Lunas').length;g.innerHTML=list.map(o=>filled(o)?`<article class="card"><div class="flex justify-between gap-2"><div><div class="text-[10px] text-zinc-500 font-bold">CLIENT ${String(o.slot).padStart(2,'0')}</div><h3 class="font-extrabold mt-1 truncate max-w-[190px]">${esc(o.nama)}</h3><p class="text-xs text-zinc-500">${esc(o.bidang||'Bidang belum diisi')}</p></div>${stat(o)}</div><div class="mt-4 space-y-2 text-xs"><div class="flex justify-between"><span class="text-zinc-500">Paket</span><b>${esc(o.paket||'-')}</b></div><div class="flex justify-between"><span class="text-zinc-500">Harga</span><b>${rp(o.harga)}</b></div><div class="flex justify-between"><span class="text-zinc-500">Pembayaran</span>${pay(o)}</div></div><button class="btn dark w-full mt-4" onclick="openOrder(${o.slot})"><i class="fa-solid fa-pen"></i> Edit Pesanan</button></article>`:`<article class="card empty" onclick="openOrder(${o.slot})"><div><div class="w-11 h-11 rounded-full bg-white/5 flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-plus text-zinc-500"></i></div><div class="text-[10px] text-zinc-500 font-bold">CLIENT ${String(o.slot).padStart(2,'0')}</div><p class="text-xs text-zinc-500 mt-1">Tambah pesanan</p></div></article>`).join('')||'<div class="col-span-full text-center text-zinc-500 py-12">Tidak ada data yang cocok.</div>';$('table').innerHTML=`<table><thead><tr><th>Client</th><th>Paket</th><th>Harga</th><th>Bayar</th><th>Status</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${filled(o)?esc(o.nama):'Client Kosong'}</b><div class="text-zinc-500">${esc(o.bidang||'')}</div></td><td>${esc(o.paket||'-')}</td><td>${rp(o.harga)}</td><td>${filled(o)?pay(o):'-'}</td><td>${stat(o)}</td><td><button class="btn dark" onclick="openOrder(${o.slot})"><i class="fa-solid fa-pen"></i></button></td></tr>`).join('')}</tbody></table>`}

function csv(){let rows=data.filter(filled),a=document.createElement('a'),out=[['Client','Nama Usaha','Bidang','Paket','Jenis Logo','Harga','Dibayar','Status','Proses','Selesai','Brief'],...rows.map(o=>[o.slot,o.nama,o.bidang,o.paket,o.jenis,o.harga,o.bayar,o.pay,o.proses?'Ya':'Tidak',o.done?'Ya':'Tidak',o.brief])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');a.href=URL.createObjectURL(new Blob(['\ufeff'+out],{type:'text/csv;charset=utf-8'}));a.download='REYPROID-pesanan.csv';a.click();toast('CSV dibuat')}

function closeInvoice(){$('invoiceModal').classList.remove('on')}function printInvoice(){let w=open('','_blank');w.document.write('<html><head><title>Nota REYPROID</title></head><body>'+$('invoiceArea').outerHTML+'<script>window.print()<\/script></body></html>');w.document.close()}async function captureInvoice(){return await html2canvas($('invoiceArea'),{scale:2,useCORS:true,backgroundColor:'#fff'});}async function jpg(){try{let c=await captureInvoice();c.toBlob(function(blob){if(!blob){toast('Gagal membuat JPG');return}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Nota-REYPROID-'+String(active).padStart(3,'0')+'.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Nota JPG berhasil disimpan')},'image/jpeg',0.95)}catch(e){console.error(e);toast('Gagal menyimpan JPG')}}async function pdf(){let c=await captureInvoice(),p=new jspdf.jsPDF('p','mm','a4'),w=190,h=c.height*w/c.width,img=c.toDataURL('image/jpeg',0.95);let y=10;if(h<=277){p.addImage(img,'JPEG',10,y,w,h)}else{let pageH=277;let ratio=w/c.width;let pagePx=pageH/ratio;let sy=0;while(sy<c.height){let sh=Math.min(pagePx,c.height-sy);let canvas=document.createElement('canvas');canvas.width=c.width;canvas.height=sh;let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(c,0,sy,c.width,sh,0,0,c.width,sh);p.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',10,10,w,sh*ratio);sy+=sh;if(sy<c.height)p.addPage()}}p.save('Nota-REYPROID-'+String(active).padStart(3,'0')+'.pdf');toast('Nota PDF berhasil disimpan')}window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}});window.addEventListener('storage',e=>{if(e.key===KEY)load()});load();view('grid');
